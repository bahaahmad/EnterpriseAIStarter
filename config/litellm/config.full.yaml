# A2 gateway — stage 3+. Requires profiles guard and trace to be up.
# Physical models sized for a 16 GB CPU laptop. Server: point the same names at vLLM.
model_list:
  - model_name: chat-default              # answerer
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: chat-quality              # quality check + eval judge (different model from answerer)
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: embed-default             # bge-m3, 1024 dims — must match db/init.sql
    litellm_params:
      model: ollama/bge-m3
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: kb-copilot                # the product: rag-service behind the gateway
    litellm_params:
      model: openai/kb-copilot
      api_base: os.environ/RAG_SERVICE_URL
      api_key: os.environ/RAG_SERVICE_KEY
      timeout: 600                        # CPU inference is slow

  - model_name: safety-guard              # optional; pull llama-guard3:1b only if RAM allows
    litellm_params:
      model: ollama_chat/llama-guard3:1b
      api_base: os.environ/OLLAMA_API_BASE

guardrails:
  - guardrail_name: presidio-pii
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: true
      # Entity list is NOT optional in practice. With Presidio's defaults, DATE_TIME matches every duration
      # ("7 business days", "30 seconds", "2 minutes") and NRP matches nationalities and roles, so policy
      # answers come back as "credited within <DATE_TIME>" — structurally correct and useless. Masking runs
      # before retrieval and before the model, so the model never sees the number either.
      # Keep the entities that are actually personal data; measure any addition against the golden set.
      pii_entities_config:
        PERSON: "MASK"
        PHONE_NUMBER: "MASK"
        EMAIL_ADDRESS: "MASK"
        CREDIT_CARD: "MASK"
        IBAN_CODE: "MASK"
        US_SSN: "MASK"
      # Deliberately absent: DATE_TIME, NRP, LOCATION, URL — over-match on ordinary policy language.

litellm_settings:
  # "otel" rather than "arize_phoenix": it emits guardrail and internal-call spans, so the trace shows
  # Presidio running before the model (evidence for REQ-A7). Endpoint comes from OTEL_* in docker-compose.yml.
  # Known limitation: the gateway still starts its own trace, so one question produces two traces (see TODO).
  callbacks: ["otel"]
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # VERIFY in stage 1 (R1): identity header forwarded to the rag-service backend
  forward_client_headers_to_llm_api: true
